<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prowell Good-Writers Watcher</title>
<style>
*{box-sizing:border-box}
body{width:260px;margin:0;padding:13px;background:white;color:#20324b;font:12px/1.45 system-ui,Arial,sans-serif}
h1{font-size:16px;margin:0 0 7px}p{font-size:11px;line-height:1.5;color:#52677c;margin:8px 0}
.controls{display:flex;gap:8px;margin:12px 0}
button{flex:1;border:1px solid #c4d2dd;border-radius:7px;padding:9px 5px;background:white;font-weight:700;cursor:pointer}
button:disabled{opacity:.48;cursor:default}
#arm{color:white;background:#187c53;border-color:#187c53}#stop{color:#b42a3c}
#status{margin:10px 0;white-space:pre-wrap}#notice{margin:7px 0;color:#5d7188}
</style></head><body>
<h1>Good-Writers Watcher</h1>
<p>Version 1.0.17 · 2-second idle refresh. On an order: sound notification, STOP, open View once, then remain stopped. Order acceptance is manual.</p>
<div class="controls">
<button id="arm" type="button">START WATCH</button>
<button id="stop" type="button">STOP</button>
</div>
<div id="status" role="status">Checking status…</div>
<p id="notice" role="status"></p>
<script src="popup.js"></script><script src="popup-refresh.js"></script>
</body></html>
