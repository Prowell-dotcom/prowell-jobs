<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prowell Dual-Platform Instant Bot</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:16px;width:490px;background:#fff;color:#142c4d;font:16px/1.35 system-ui,Arial,sans-serif}
  .site{margin:0 0 22px}
  .site:last-of-type{margin-bottom:0}
  h2{margin:0 0 14px;font-size:20px;line-height:1.2;font-weight:750}
  .actions{display:flex;gap:12px}
  button{flex:1;min-width:0;height:54px;border:1px solid #bdd0e6;border-radius:12px;background:#fff;
    cursor:pointer;font:700 19px/1.1 system-ui,Arial,sans-serif;white-space:nowrap}
  .start{background:#8bbca9;border-color:#8bbca9;color:#fff}
  .stop{color:#c82632}
  button:disabled{cursor:default;opacity:.53}
  .stop:disabled{color:#d8a4ae}
  button:focus-visible{outline:3px solid #3776c5;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>
<section class="site" aria-label="4writers bot controls">
  <h2>4writers.net</h2>
  <div class="actions">
    <button type="button" class="start" data-start="four">START AUTO-TAKE</button>
    <button type="button" class="stop" data-stop="four">STOP</button>
  </div>
</section>
<section class="site" aria-label="Good-Writers bot controls">
  <h2>good-writers.com</h2>
  <div class="actions">
    <button type="button" class="start" data-start="good">START AUTO-TAKE</button>
    <button type="button" class="stop" data-stop="good">STOP</button>
  </div>
</section>
<div id="sr-notice" class="sr-only" role="status" aria-live="polite"></div>
<script src="popup.js"></script>
</body>
</html>
