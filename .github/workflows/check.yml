
name: Website checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q server.py

      - name: Validate Chrome extension JavaScript
        run: |
          node --check extension/4writers/content.js
          node --check extension/4writers/background.js
          node --check extension/4writers/popup.js
          node --check extension/4writers/refresh.js
          node --check extension/4writers/popup-refresh.js
          node tests/test_extension_flow.cjs
          node tests/test_extension_refresh.cjs

      - name: Run website tests
        run: python -m unittest discover -s tests -v
