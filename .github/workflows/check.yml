
name: Website checks

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m compileall -q server.py admin_paraphraser.py

      - name: Validate Chrome extension JavaScript
        run: |
          node --check admin.js
          node --check admin-paraphraser.js
          node tests/test_paraphraser_paste.cjs
          node --check extension/4writers/content.js
          node --check extension/4writers/background.js
          node --check extension/4writers/popup.js
          node --check extension/4writers/refresh.js
          node --check extension/4writers/auto-accept.js
          node --check extension/4writers/popup-refresh.js
          node tests/test_extension_refresh.cjs
          node tests/test_good_writers_refresh.cjs
          node --check extension/good-writers/background.js
          node --check extension/good-writers/content.js
          node --check extension/good-writers/refresh.js
          node --check extension/good-writers/auto-accept.js
          node --check extension/good-writers/popup.js
          node --check extension/good-writers/popup-refresh.js
          node --check extension/4writers/order-card.js
          node --check extension/good-writers/order-card.js
          node tests/test_order_cards.cjs
          node --check extension/4writers/order-sound-background.js
          node --check extension/4writers/order-sound.js
          node --check extension/good-writers/order-sound-background.js
          node --check extension/good-writers/order-sound.js
          node tests/test_order_audio.cjs
          node tests/test_view_only_handoff.cjs
          node tests/test_instant_view_before_storage.cjs
          node tests/test_repeat_orders.cjs
          node tests/test_full_auto_take_enabled.cjs
          node tests/test_native_confirm.cjs
          node tests/test_new_tab_handoff.cjs
          node tests/test_instant_view_before_storage.cjs
          node tests/test_new_tab_handoff.cjs
          node tests/test_auto_accept.cjs
          node tests/test_native_confirm.cjs
          node --check extension/4writers/confirm-main.js
          node --check extension/good-writers/confirm-main.js
          node tests/test_view_navigation_scroll.cjs
          node tests/test_foreground_order_popup.cjs
          node --check extension/dual-writers/scoped-store.js
          node --check extension/dual-writers/confirm-main.js
          node --check extension/dual-writers/background.js
          node --check extension/dual-writers/content.js
          node --check extension/dual-writers/refresh.js
          node --check extension/dual-writers/auto-accept.js
          node --check extension/dual-writers/popup.js
          node --check extension/dual-writers/four-order-card.js
          node --check extension/dual-writers/good-order-card.js
          node --check extension/dual-writers/legacy-bridge.js
          node --check extension/dual-writers/legacy-order-sound.js
          node --check extension/dual-writers/legacy/four/runtime-content.js
          node --check extension/dual-writers/legacy/four/runtime-refresh.js
          node --check extension/dual-writers/legacy/good/runtime-content.js
          node --check extension/dual-writers/legacy/good/runtime-refresh.js
          node tests/test_dual_writers.cjs
          node tests/test_dual_legacy_merge.cjs

      - name: Run website tests
        run: python -m unittest discover -s tests -v
