name: Prowell Humanizer tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m compileall -q server.py admin_paraphraser.py prowell_deeprewrite.py prowell_openai_rewrite.py prowell_gemini_rewrite.py tests
      - name: Run all unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -v
      - name: Verify UI hybrid selector and API routing
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path("index.html").read_text(encoding="utf-8")
          server=Path("admin_paraphraser.py").read_text(encoding="utf-8")
          assert 'value="hybrid"' in page
          assert "engine.value=openaiAvailable?'openai':deepAvailable?'hybrid':''" in page
          assert "hybrid_rewrite if engine == \"hybrid\" else deep.rewrite" in server
          assert "No meaningful wording change" in server
          assert 'value="openai"' in page
          assert 'value="gemini"' in page
          assert '"public-paraphrase-openai", limit=3' in server
          print("Hybrid integration checks passed")
          PY
